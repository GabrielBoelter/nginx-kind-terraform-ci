apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-aula-11
  labels:
    app: nginx-aula-11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-aula-11
  template:
    metadata:
      labels:
        app: nginx-aula-11
    spec:
      containers:
        - name: nginx
          image: nginx-aula-11:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
